[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dual-kd-compression"
version = "1.0.0"
description = "Vanilla KL and Dual-constrained KD for structured FFN gate compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
experiment = [
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
  "pyarrow>=16.0",
  "wandb>=0.19",
]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dualkd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
