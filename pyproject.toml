[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tuac"
version = "0.1.0"
description = "Teacher-uncertainty-aware mixed-precision compression research toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hf = [
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
  "pyyaml>=6.0",
]
test = ["pytest>=8.0"]

[project.scripts]
tuac = "tuac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tuac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

