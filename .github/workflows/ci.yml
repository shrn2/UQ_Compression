name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate supported configuration
        run: python -c "from dualkd.config import load_config; load_config('configs/experiment.yaml')"
      - name: Compile Python sources
        run: python -m compileall -q src/dualkd scripts
      - name: Run tests
        run: pytest -q
