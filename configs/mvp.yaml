# Reference values for the minimum experiment. CLI flags are authoritative.
teacher_model: Qwen/Qwen2.5-7B-Instruct
student_model: Qwen/Qwen2.5-1.5B-Instruct
probe_bits: 4
group_size: 128
bit_choices: [3, 4, 8]
average_bit_budgets: [4.0, 3.5, 3.0]
score_modes:
  - student_only
  - teacher_confidence
  - teacher_uncertainty
  - disagreement
  - combined
