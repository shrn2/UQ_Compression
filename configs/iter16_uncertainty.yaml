study: upgd-uncertainty-regularization
output_root: runs/iter16_uncertainty_reg
calibration:
  mixture_examples_per_dataset: 256
  datasets: [hellaswag, arc_challenge, mmlu_aux]
  entropy_strata: 3
models:
  1p5b:
    name: Qwen/Qwen2.5-1.5B-Instruct
    quantization: none
    calibration_artifact: calibration_1p5b.npz
  3b_nf4:
    name: Qwen/Qwen2.5-3B-Instruct
    quantization: 4bit
    calibration_artifact: calibration_3b_nf4.npz
lambdas: [0.0, 0.25, 0.5, 1.0]
seeds: [1, 2, 3]
steps: 300
sparsity: 0.5
groups_per_batch: 1
evaluation:
  hellaswag: runs/iter13_transfer/datasets/hellaswag.jsonl
  arc_challenge: runs/iter15_ablation_previous/datasets/arc_challenge.jsonl
  mmlu_aux: runs/iter15_ablation_previous/datasets/mmlu_aux.jsonl
